<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element Shot - Simple Fixture</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        color: #18211d;
        background: #eef1ef;
        font-family: Georgia, serif;
      }
      main { width: 720px; margin: 0 auto; padding: 52px 0 90px; }
      nav { margin-bottom: 18px; font: 700 13px/1.2 sans-serif; }
      nav a { color: #263c73; }
      h1 { margin: 0 0 24px; font-size: 28px; letter-spacing: 0; }
      #simple-target {
        width: 420px;
        height: 240px;
        overflow: auto;
        background: #fff;
        box-shadow: 0 0 0 2px #18211d;
      }
      .row {
        display: flex;
        height: 64px;
        flex: 0 0 64px;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        border-bottom: 1px solid rgb(24 33 29 / 22%);
        font-size: 17px;
      }
      .row:nth-child(3n + 1) { background: #f9d66d; }
      .row:nth-child(3n + 2) { background: #b9dfd0; }
      .row:nth-child(3n) { background: #f6a58d; }
      .row strong { font: 700 12px/1 monospace; }
      #static-target {
        width: 300px;
        margin-top: 36px;
        padding: 24px;
        border: 2px solid #18211d;
        background: #fff;
      }
      #static-target h2 { margin: 0 0 8px; font-size: 20px; }
      #static-target p { margin: 0; line-height: 1.5; }
      #fixed-obstruction {
        position: fixed;
        z-index: 10;
        top: 170px;
        left: calc(50% - 310px);
        width: 150px;
        padding: 10px;
        color: #fff;
        background: #263c73;
        font: 700 12px/1.2 monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="./test-complex.html">打开复杂测试场景</a></nav>
      <h1>Simple scroll container</h1>
      <section id="simple-target" aria-label="Simple screenshot target">
        <div class="row"><span>Mercury</span><strong>ROW 01</strong></div>
        <div class="row"><span>Venus</span><strong>ROW 02</strong></div>
        <div class="row"><span>Earth</span><strong>ROW 03</strong></div>
        <div class="row"><span>Mars</span><strong>ROW 04</strong></div>
        <div class="row"><span>Jupiter</span><strong>ROW 05</strong></div>
        <div class="row"><span>Saturn</span><strong>ROW 06</strong></div>
        <div class="row"><span>Uranus</span><strong>ROW 07</strong></div>
        <div class="row"><span>Neptune</span><strong>ROW 08</strong></div>
        <div class="row"><span>Pluto</span><strong>ROW 09</strong></div>
      </section>

      <article id="static-target">
        <h2>Static card</h2>
        <p>A compact non-scrolling target for the single-frame path.</p>
      </article>
    </main>
    <aside id="fixed-obstruction">FIXED OVERLAY</aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
