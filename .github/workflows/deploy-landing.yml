name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'public/landing/**'
      - 'extension-public/_locales/**'
      - 'extension-public/icon/**'
      - 'public/index.html'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep runtime assets in one source directory. The Pages artifact is a
      # temporary deployment tree, so it can expose the landing's relative
      # /_locales and /icon URLs without duplicating those files in the repo.
      - name: Prepare Pages artifact
        run: |
          cp -R public site
          cp -R extension-public/_locales site/_locales
          mkdir -p site/icon
          cp extension-public/icon/*.png site/icon/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
