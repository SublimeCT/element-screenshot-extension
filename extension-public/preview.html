<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshot Suite Preview</title>
    <style>
      :root { color-scheme: dark; background: #151a20; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #151a20; }
      img { display: block; max-width: 100%; height: auto; box-shadow: 0 16px 48px rgb(0 0 0 / 35%); }
      .empty { color: #cbd3da; font: 14px/1.4 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div class="empty">Loading preview...</div>
    <script src="./preview.js"></script>
  </body>
</html>
